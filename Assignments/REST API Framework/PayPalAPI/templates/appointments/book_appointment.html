{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-8 text-center">
        <h1 class="text-3xl font-bold text-gray-800">Book Appointment</h1>
        <p class="text-gray-600 mt-2">Fill in your details to book a consultation with <span class="font-bold">Dr. {{ doctor.name }}</span>.</p>
    </div>

    <div class="bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden">
        <div class="bg-blue-50 p-6 border-b border-blue-100 flex justify-between items-center">
            <div>
                <h3 class="font-bold text-gray-800">Dr. {{ doctor.name }}</h3>
                <p class="text-sm text-blue-600">{{ doctor.specialty }}</p>
            </div>
            <div class="text-right">
                <p class="text-sm text-gray-500">Consultation Fee</p>
                <p class="font-bold text-xl text-gray-800">${{ doctor.consultation_fee }}</p>
            </div>
        </div>
        
        <form method="POST" class="p-6 space-y-6">
            {% csrf_token %}
            <div>
                <label for="patient_name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="patient_name" name="patient_name" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>
            
            <div>
                <label for="patient_email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="patient_email" name="patient_email" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="date" class="block text-sm font-medium text-gray-700 mb-1">Preferred Date</label>
                    <input type="date" id="date" name="date" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>
                <div>
                    <label for="time" class="block text-sm font-medium text-gray-700 mb-1">Preferred Time</label>
                    <input type="time" id="time" name="time" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>
            </div>
            
            <div class="pt-4 border-t border-gray-100">
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition-colors duration-300 shadow-md">
                    Continue to Payment
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
