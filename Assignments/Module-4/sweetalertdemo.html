<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SweetAlert Input</title>

    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<h1 style="text-align:center;">Demo JavaScript</h1>
<hr>

<script>

async function getNumbers() {

    const { value: formValues } = await Swal.fire({
        title: "Enter Two Numbers",
        html:
            '<input id="num1" class="swal2-input" placeholder="Enter number 1">' +
            '<input id="num2" class="swal2-input" placeholder="Enter number 2">',
        focusConfirm: false,
        showCancelButton: true,
        preConfirm: () => {
            const n1 = document.getElementById('num1').value;
            const n2 = document.getElementById('num2').value;

            if (!n1 || !n2) {
                Swal.showValidationMessage("Please enter both numbers");
                return false;
            }

            return [n1, n2];
        }
    });

    if (formValues) {
        let no1 = Number(formValues[0]);
        let no2 = Number(formValues[1]);
        let sum = no1 + no2;

        Swal.fire({
            title: "Confirm Addition?",
            text: "You are adding " + no1 + " and " + no2,
            icon: "warning",
            showCancelButton: true,
            confirmButtonText: "Yes, add it!"
        }).then((result) => {

            if (result.isConfirmed) {
                Swal.fire({
                    title: "Result",
                    text: "The sum is: " + sum,
                    icon: "success"
                });
            }

        });
    }
}

getNumbers();

</script>

</body>
</html>
