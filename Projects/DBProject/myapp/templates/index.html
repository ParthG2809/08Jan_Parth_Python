<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Project</title>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body style="background-color: azure;">
    <h1 style="text-align: center; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Welcome to Database</h1>
    <hr>

     <form method="post">
        {% csrf_token %}
        <input type="text", name="name", placeholder="Name"><br><br>
        <input type="email", name="email", placeholder="Email"><br><br>
        <input type="date", name="dob"><br><br>
        <input type="number", name="mobile", placeholder="Number"><br><br>
        <textarea name="address" placeholder="Address"></textarea><br><br>
        <input type="submit" name="Save">
     </form>

     <a href="/showdata">Showdata</a>
</body>
</html>
