<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Inter', Helvetica, Arial, sans-serif; background-color: #f9f9f9; margin: 0; padding: 0; }
        .wrapper { width: 100%; table-layout: fixed; background-color: #f9f9f9; padding-bottom: 40px; }
        .main { background-color: #ffffff; margin: 0 auto; width: 100%; max-width: 500px; border-spacing: 0; color: #000000; border-radius: 20px; overflow: hidden; margin-top: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .header { background-color: #000000; padding: 40px; text-align: center; }
        .header h1 { color: #ffffff; margin: 0; font-size: 24px; letter-spacing: -1px; font-weight: 800; }
        .content { padding: 40px; line-height: 1.6; text-align: center; }
        .content h2 { font-size: 20px; font-weight: 700; margin-top: 0; }
        .otp-container { background-color: #f3f3f3; padding: 20px; border-radius: 12px; margin: 30px 0; display: inline-block; }
        .otp-code { font-size: 32px; font-weight: 900; letter-spacing: 10px; color: #000000; }
        .footer { text-align: center; padding: 20px; color: #999999; font-size: 12px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <table class="main">
            <tr>
                <td class="header">
                    <h1>NOTES<span style="font-weight: 300;">APP</span></h1>
                </td>
            </tr>
            <tr>
                <td class="content">
                    <h2>Reset Your Password</h2>
                    <p>We received a request to reset your password. Use the verification code below to proceed:</p>
                    
                    <div class="otp-container">
                        <span class="otp-code">{{ otp }}</span>
                    </div>

                    <p>If you didn't request this, you can safely ignore this email.</p>
                    <p style="margin-top: 40px;">Best regards,<br><strong>The NotesApp Team</strong></p>
                </td>
            </tr>
            <tr>
                <td class="footer">
                    &copy; 2026 NotesApp. All rights reserved.
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
