<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Inter', sans-serif; color: #1a1a1a; background-color: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 16px; overflow: hidden; }
        .header { background-color: #000000; padding: 30px; text-align: center; }
        .header h1 { color: #ffffff; margin: 0; font-size: 20px; }
        .content { padding: 40px; text-align: center; }
        .status { 
            display: inline-block; 
            padding: 8px 20px; 
            border-radius: 99px; 
            font-weight: bold; 
            text-transform: uppercase; 
            font-size: 14px;
            margin: 20px 0;
        }
        .status-Approved { background-color: #ecfdf5; color: #059669; border: 1px solid #10b981; }
        .status-Rejected { background-color: #fef2f2; color: #dc2626; border: 1px solid #ef4444; }
        .footer { padding: 20px; text-align: center; font-size: 12px; color: #999999; border-top: 1px solid #eeeeee; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>NOTESAPP UPDATE</h1></div>
        <div class="content">
            <h3>Hello {{ user.full_name }},</h3>
            <p>The status of your note "<strong>{{ note.title }}</strong>" has been updated.</p>
            
            <div class="status status-{{ note.status }}">
                {{ note.status }}
            </div>
            
            <p>You can check the details on your dashboard.</p>
        </div>
        <div class="footer">&copy; 2026 NotesApp Inc.</div>
    </div>
</body>
</html>
