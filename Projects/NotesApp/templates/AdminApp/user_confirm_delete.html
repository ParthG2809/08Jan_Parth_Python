{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-20 transition-colors duration-300">
    <div class="bg-white dark:bg-zinc-900 rounded-3xl border border-red-100 dark:border-red-900 p-10 shadow-2xl text-center transition-colors">
        <div class="w-20 h-20 bg-red-50 dark:bg-red-900/20 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-red-600 dark:text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
        
        <h1 class="text-3xl font-bold text-black dark:text-white uppercase tracking-tighter mb-2">Delete <span class="font-light">User?</span></h1>
        <p class="text-gray-500 dark:text-gray-400 mb-8">Are you sure you want to delete <span class="font-bold text-black dark:text-white">{{ object.email }}</span>? This action is irreversible and will delete all their notes.</p>

        <form method="POST" class="flex gap-4">
            {% csrf_token %}
            <a href="{% url 'admin_users' %}" class="flex-1 py-4 bg-gray-100 dark:bg-zinc-800 text-black dark:text-white font-bold rounded-2xl text-center hover:bg-gray-200 dark:hover:bg-zinc-700 transition">Cancel</a>
            <button type="submit" class="flex-1 py-4 bg-red-600 text-white font-bold rounded-2xl hover:bg-red-700 transition shadow-lg shadow-red-100 dark:shadow-none">
                Yes, Delete User
            </button>
        </form>
    </div>
</div>
{% endblock %}
