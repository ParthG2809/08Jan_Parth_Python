{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-32 text-center">
    <div class="bg-white p-10 rounded-3xl border border-gray-100 shadow-sm">
        <div class="w-20 h-20 bg-red-50 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </div>
        <h2 class="text-2xl font-bold text-black mb-2">Delete Note?</h2>
        <p class="text-gray-500 mb-8">Are you sure you want to delete "<span class="font-bold border-b border-gray-200 text-black">{{ object.title }}</span>"? This action cannot be undone.</p>
        
        <form method="POST" class="flex flex-col gap-4">
            {% csrf_token %}
            <button type="submit" class="bg-red-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-red-700 transition">
                Yes, Delete Note
            </button>
            <a href="{% url 'dashboard' %}" class="bg-gray-100 text-black px-8 py-3 rounded-xl font-bold hover:bg-gray-200 transition">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
