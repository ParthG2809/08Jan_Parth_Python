{% extends 'base.html' %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-50 dark:bg-black transition-colors duration-300">
    <div class="max-w-md w-full space-y-8 bg-white dark:bg-zinc-900 p-10 rounded-[3rem] border border-gray-100 dark:border-gray-800 shadow-2xl">
        <div>
            <h2 class="mt-6 text-center text-3xl font-black text-black dark:text-white uppercase tracking-tighter">Verify <span class="font-light">Identity</span></h2>
            <p class="mt-2 text-center text-sm text-gray-500 dark:text-gray-400">Enter the 6-digit code sent to your email.</p>
        </div>
        <form class="mt-8 space-y-6" method="POST">
            {% csrf_token %}
            <div class="space-y-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-gray-400 dark:text-zinc-500 uppercase tracking-widest ml-1">Verification Code</label>
                    <input type="text" name="otp" required maxlength="6" class="appearance-none relative block w-full px-5 py-4 bg-gray-50 dark:bg-zinc-800 border border-gray-100 dark:border-gray-800 placeholder-gray-400 text-black dark:text-white rounded-2xl focus:outline-none focus:ring-1 focus:ring-black dark:focus:ring-white transition text-center text-2xl font-black tracking-[0.5em]" placeholder="000000">
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-sm font-black uppercase tracking-widest rounded-2xl text-white dark:text-black bg-black dark:bg-white hover:scale-[1.02] active:scale-[0.98] transition shadow-xl">
                    Verify Code
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
