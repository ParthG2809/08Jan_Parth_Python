{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-20">
    <div class="mb-8">
        <a href="{% url 'dashboard' %}" class="text-sm text-gray-500 hover:text-black flex items-center gap-1 mb-4">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Dashboard
        </a>
        <h1 class="text-3xl font-bold text-black">{% if form.instance.pk %}Edit Note{% else %}New Note{% endif %}</h1>
    </div>

    <form method="POST" enctype="multipart/form-data" class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
        {% csrf_token %}
        <div class="space-y-6">
            {% for field in form %}
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}
            <div class="pt-4 flex gap-4">
                <button type="submit" class="flex-grow bg-black text-white px-8 py-3 rounded-xl font-bold hover:bg-gray-800 transition shadow-lg">
                    Save Note
                </button>
                <a href="{% url 'dashboard' %}" class="px-8 py-3 bg-gray-100 text-black rounded-xl font-bold hover:bg-gray-200 transition">
                    Cancel
                </a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
