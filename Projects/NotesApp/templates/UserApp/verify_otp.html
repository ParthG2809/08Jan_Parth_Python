{% extends 'base.html' %}

{% block content %}
<div class="min-h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl border border-gray-100 shadow-sm text-center">
        <div>
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-gray-100 mb-4">
                <svg class="h-8 w-8 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
            </div>
            <h2 class="text-3xl font-extrabold text-gray-900">Verify your email</h2>
            <p class="mt-2 text-sm text-gray-600">
                A 6-digit verification code was sent to <span class="font-bold text-black">{{ email }}</span>
            </p>
        </div>
        <form class="mt-8 space-y-6" method="POST">
            {% csrf_token %}
            <div class="flex justify-center">
                <input type="text" name="otp" maxlength="6" pattern="\d{6}" required
                    class="w-full text-center text-4xl tracking-widest font-mono p-4 border border-gray-200 rounded-xl focus:outline-none focus:border-black focus:ring-1 focus:ring-black"
                    placeholder="000000" autocomplete="off">
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-lg text-white bg-black hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-black transition">
                    Verify Code
                </button>
            </div>
        </form>
        <div class="text-center">
            <p class="text-sm text-gray-600">Didn't receive the code? <a href="{% url 'resend_otp' %}" class="font-bold text-black hover:underline">Resend OTP</a></p>
        </div>
    </div>
</div>
{% endblock %}
