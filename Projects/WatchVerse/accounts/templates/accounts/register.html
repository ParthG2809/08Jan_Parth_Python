{% extends 'accounts/base.html' %}

{% block title %}Join WatchVerse - Sign Up{% endblock %}

{% block content %}
<div class="w-full max-w-md glass-card rounded-2xl p-8 md:p-10 fade-in">
    <h2 class="text-3xl font-bold mb-2">Create Account</h2>
    <p class="text-gray-400 mb-8">Join the ultimate community for movie lovers.</p>

    <form method="POST" class="space-y-6">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Full Name</label>
            <input type="text" name="full_name" required 
                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white input-focus transition-all"
                placeholder="Enter your name">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
            <input type="email" name="email" required 
                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white input-focus transition-all"
                placeholder="you@example.com">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
            <div class="relative">
                <input type="password" name="password" id="password" required 
                    class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white input-focus transition-all"
                    placeholder="••••••••">
                <button type="button" onclick="togglePassword('password')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                    <i class="fas fa-eye" id="password-icon"></i>
                </button>
            </div>
        </div>

        <button type="submit" 
            class="w-full netflix-red hover:bg-red-700 text-white font-bold py-4 rounded-xl transition-all transform hover:scale-[1.02] active:scale-95 shadow-lg shadow-red-600/20">
            Sign Up
        </button>
    </form>

    <div class="mt-8 text-center text-gray-400">
        Already have an account? 
        <a href="{% url 'login' %}" class="text-white hover:underline font-semibold ml-1">Log In</a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function togglePassword(id) {
        const input = document.getElementById(id);
        const icon = document.getElementById(id + '-icon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }
</script>
{% endblock %}
