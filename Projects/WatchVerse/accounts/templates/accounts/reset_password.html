{% extends 'accounts/base.html' %}

{% block title %}Set New Password - WatchVerse{% endblock %}

{% block content %}
<div class="w-full max-w-md glass-card rounded-2xl p-8 md:p-10 fade-in">
    <div class="text-center mb-8">
        <h2 class="text-3xl font-bold mb-2">Set New Password</h2>
        <p class="text-gray-400">Enter the 6-digit code sent to your email and choose a new password.</p>
    </div>

    <form method="POST" id="reset-form" class="space-y-6">
        {% csrf_token %}
        
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Verification Code</label>
            <div class="flex justify-between gap-2" id="otp-inputs">
                <input type="text" maxlength="1" class="otp-box w-12 h-14 bg-black/40 border border-white/10 rounded-xl text-center text-xl font-bold text-white focus:outline-none otp-input transition-all">
                <input type="text" maxlength="1" class="otp-box w-12 h-14 bg-black/40 border border-white/10 rounded-xl text-center text-xl font-bold text-white focus:outline-none otp-input transition-all">
                <input type="text" maxlength="1" class="otp-box w-12 h-14 bg-black/40 border border-white/10 rounded-xl text-center text-xl font-bold text-white focus:outline-none otp-input transition-all">
                <input type="text" maxlength="1" class="otp-box w-12 h-14 bg-black/40 border border-white/10 rounded-xl text-center text-xl font-bold text-white focus:outline-none otp-input transition-all">
                <input type="text" maxlength="1" class="otp-box w-12 h-14 bg-black/40 border border-white/10 rounded-xl text-center text-xl font-bold text-white focus:outline-none otp-input transition-all">
                <input type="text" maxlength="1" class="otp-box w-12 h-14 bg-black/40 border border-white/10 rounded-xl text-center text-xl font-bold text-white focus:outline-none otp-input transition-all">
            </div>
            <input type="hidden" name="otp" id="final-otp">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">New Password</label>
            <div class="relative">
                <input type="password" name="password" id="password" required 
                    class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white input-focus transition-all"
                    placeholder="••••••••">
                <button type="button" onclick="togglePassword('password')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                    <i class="fas fa-eye" id="password-icon"></i>
                </button>
            </div>
        </div>

        <button type="submit" 
            class="w-full netflix-red hover:bg-red-700 text-white font-bold py-4 rounded-xl transition-all transform hover:scale-[1.02] active:scale-95 shadow-lg shadow-red-600/20">
            Reset Password
        </button>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const inputs = document.querySelectorAll('.otp-box');
    const form = document.getElementById('reset-form');
    const finalOtp = document.getElementById('final-otp');

    inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            if (e.target.value.length > 1) {
                e.target.value = e.target.value.slice(0, 1);
            }
            if (e.target.value && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
            updateFinalOtp();
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !e.target.value && index > 0) {
                inputs[index - 1].focus();
            }
        });
    });

    function updateFinalOtp() {
        let otp = "";
        inputs.forEach(input => {
            otp += input.value;
        });
        finalOtp.value = otp;
    }

    form.addEventListener('submit', (e) => {
        updateFinalOtp();
        if (finalOtp.value.length !== 6) {
            e.preventDefault();
            alert('Please enter all 6 digits of the OTP.');
        }
    });

    function togglePassword(id) {
        const input = document.getElementById(id);
        const icon = document.getElementById(id + '-icon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    window.onload = () => inputs[0].focus();
</script>
{% endblock %}
