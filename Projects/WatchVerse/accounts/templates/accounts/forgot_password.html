{% extends 'accounts/base.html' %}

{% block title %}Forgot Password - WatchVerse{% endblock %}

{% block content %}
<div class="w-full max-w-md glass-card rounded-2xl p-8 md:p-10 fade-in">
    <div class="text-center mb-8">
        <div class="w-16 h-16 bg-white/10 border border-white/20 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-key text-white text-2xl"></i>
        </div>
        <h2 class="text-3xl font-bold mb-2">Reset Password</h2>
        <p class="text-gray-400">Enter your email and we'll send you an OTP to reset your password.</p>
    </div>

    <form method="POST" class="space-y-6">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
            <input type="email" name="email" required 
                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white input-focus transition-all"
                placeholder="you@example.com">
        </div>

        <button type="submit" 
            class="w-full netflix-red hover:bg-red-700 text-white font-bold py-4 rounded-xl transition-all transform hover:scale-[1.02] active:scale-95 shadow-lg shadow-red-600/20">
            Send OTP
        </button>
    </form>

    <div class="mt-8 text-center text-gray-400">
        Remember your password? 
        <a href="{% url 'login' %}" class="text-white hover:underline font-semibold ml-1">Back to Login</a>
    </div>
</div>
{% endblock %}
